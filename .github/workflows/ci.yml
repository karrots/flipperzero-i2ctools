name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ufbt assets
        uses: actions/cache@v4
        with:
          path: ~/.ufbt
          key: ufbt-${{ runner.os }}-${{ hashFiles('application.fam') }}
          restore-keys: |
            ufbt-${{ runner.os }}-

      - name: Install ufbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ufbt

      - name: Update toolchain
        run: ufbt update

      - name: Run lint checks
        run: ufbt lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ufbt assets
        uses: actions/cache@v4
        with:
          path: ~/.ufbt
          key: ufbt-${{ runner.os }}-${{ hashFiles('application.fam') }}
          restore-keys: |
            ufbt-${{ runner.os }}-

      - name: Install ufbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ufbt

      - name: Update toolchain
        run: ufbt update

      - name: Build FAP
        run: ufbt fap

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i2c-tools-fap
          path: build/*/*.fap
          if-no-files-found: error
